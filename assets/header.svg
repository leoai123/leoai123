<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Leo Yeh — AI product builder and founder">
  <style>
    .bg { fill: #f7f5f0; }
    .ink { fill: #14213d; }
    .muted { fill: #5b6475; }
    .accent { fill: #0f766e; }
    .line { stroke: #d9d4c7; }
    .node { fill: #0f766e; }
    .node2 { fill: #e9a23b; }
    .edge { stroke: #0f766e; stroke-opacity: .35; }
    .chip { fill: #ffffff; stroke: #d9d4c7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1724; }
      .ink { fill: #f1f3f7; }
      .muted { fill: #9aa4b5; }
      .accent { fill: #2dd4bf; }
      .line { stroke: #253246; }
      .node { fill: #2dd4bf; }
      .edge { stroke: #2dd4bf; stroke-opacity: .35; }
      .chip { fill: #162133; stroke: #253246; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="300" rx="20"/>

  <!-- subtle grid -->
  <g class="line" stroke-width="1">
    <line x1="760" y1="0" x2="760" y2="300"/>
    <line x1="860" y1="0" x2="860" y2="300"/>
    <line x1="960" y1="0" x2="960" y2="300"/>
    <line x1="1060" y1="0" x2="1060" y2="300"/>
    <line x1="700" y1="75" x2="1200" y2="75"/>
    <line x1="700" y1="150" x2="1200" y2="150"/>
    <line x1="700" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- venture network: one hub, six ventures -->
  <g class="edge" stroke-width="2">
    <line x1="960" y1="150" x2="860" y2="75"/>
    <line x1="960" y1="150" x2="1060" y2="75"/>
    <line x1="960" y1="150" x2="1110" y2="150"/>
    <line x1="960" y1="150" x2="1060" y2="225"/>
    <line x1="960" y1="150" x2="860" y2="225"/>
    <line x1="960" y1="150" x2="810" y2="150"/>
  </g>
  <circle class="node" cx="960" cy="150" r="16"/>
  <circle class="node" cx="860" cy="75" r="9"/>
  <circle class="node" cx="1060" cy="75" r="9"/>
  <circle class="node2" cx="1110" cy="150" r="9"/>
  <circle class="node" cx="1060" cy="225" r="9"/>
  <circle class="node2" cx="860" cy="225" r="9"/>
  <circle class="node" cx="810" cy="150" r="9"/>

  <!-- text -->
  <text class="accent" x="64" y="86" font-size="17" font-weight="600" letter-spacing="3">AI PRODUCT BUILDER · FOUNDER</text>
  <text class="ink" x="60" y="160" font-size="68" font-weight="800" letter-spacing="-1">Leo Yeh</text>
  <text class="muted" x="64" y="204" font-size="21">I design and ship production AI products, end to end:</text>
  <text class="muted" x="64" y="234" font-size="21">from the LLM pipeline to the cloud it runs on.</text>
</svg>
